{% extends "base.html" %}
{% block title %}Sign in — MsupaaEscrow{% endblock %}
{% block public_content %}
<div class="auth-layout"><div class="auth-card">
<a class="brand dark centered" href="{{ url_for('index') }}"><span class="brand-mark">M</span><span><strong>MsupaaEscrow</strong><small>Secure transactions</small></span></a>
<h1>Welcome back</h1><p class="muted">Sign in to manage your escrow transactions.</p>
<form method="post">
<input type="hidden" name="_csrf" value="{{ csrf_token }}">
<label>Email<input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password" placeholder="••••••••"></label>
<button class="btn primary full" type="submit">Sign in</button>
</form>
<p class="auth-foot">No account? <a href="{{ url_for('register') }}">Create one</a></p>
</div></div>
{% endblock %}
